name: streetscape-public015
on:
  # Parent pushes only after exact T728 Pages publication is confirmed.
  push:
    branches: ['gpt/streetscape-public015']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: streetscape-public015-${{ github.ref }}
  cancel-in-progress: false

jobs:
  official-origin:
    if: github.repository == 'lijiabao1998/GlimmerTown-lab' && github.ref == 'refs/heads/gpt/streetscape-public015'
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
        with:
          path: observer
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Load exact approved main deployment receipt
        id: pins
        working-directory: observer
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),p=require('./streetscape-public-release015.json');
          require('./streetscape-public-contract015').verifyPins013(p);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'sha='+p.releaseSHA+'\nhtml='+p.sourceSHA256+'\n');
          NODE
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pins.outputs.sha }}
          path: deployed
          persist-credentials: false
      - name: Read successful exact main Pages deployment
        env:
          EXPECTED_DEPLOY_SHA: ${{ steps.pins.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node observer/streetscape-public-pages015.js
      - name: Source-only observer tests and immutable release provenance
        env:
          EXPECTED_DEPLOY_SHA: ${{ steps.pins.outputs.sha }}
          EXPECTED_RELEASE_HTML_SHA256: ${{ steps.pins.outputs.html }}
          EXPECTED_RELEASE_ROOT: ${{ github.workspace }}/deployed
        run: |
          set -euo pipefail
          git -C deployed fetch --depth=1 origin 7c358552922460c09a8a90fc536490233b97279d
          git -C deployed fetch --depth=1 origin 6d137b6be31a7f07867b8ebb181fb8ed3727b049
          for file in observer/streetscape-public-*015.js; do node --check "$file"; done
          node observer/console-source-observer-qa015.js
          node observer/streetscape-public-source-qa015.js
          node - <<'NODE'
          const c=require('./observer/streetscape-public-contract015');
          console.log(JSON.stringify(c.verifyRelease013(process.env.EXPECTED_RELEASE_ROOT,process.env.EXPECTED_DEPLOY_SHA,process.env.EXPECTED_RELEASE_HTML_SHA256)));
          NODE
      - name: Native font environment
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - name: Official HTML old-city plus eight-theme paid gameplay and six native cold Continue cycles
        env:
          EXPECTED_DEPLOY_SHA: ${{ steps.pins.outputs.sha }}
          EXPECTED_RELEASE_HTML_SHA256: ${{ steps.pins.outputs.html }}
          EXPECTED_RELEASE_ROOT: ${{ github.workspace }}/deployed
          CHROME_PATH: /usr/bin/google-chrome
          PUBLIC_SITE_URL: https://lijiabao1998.github.io/GlimmerTown-lab/
        run: |
          set -euo pipefail
          test -x /usr/bin/google-chrome
          mkdir -p observer/streetscape-evidence/public
          node observer/streetscape-public-qa015.js 2>&1 | tee observer/streetscape-evidence/public/runtime.txt
      - name: Both exact checkouts and all tracked source bytes stay unchanged
        if: always()
        run: |
          git -C observer diff --exit-code
          git -C deployed diff --exit-code
      - name: Preserve every report and lossless screenshot in <=28MiB parts
        if: always()
        run: python3 observer/streetscape-public-package015.py
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('observer/.streetscape-public-packets/part0/**') != ''
        with:
          name: streetscape-public-part0-${{ steps.pins.outputs.sha }}
          path: observer/.streetscape-public-packets/part0/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('observer/.streetscape-public-packets/part1/**') != ''
        with:
          name: streetscape-public-part1-${{ steps.pins.outputs.sha }}
          path: observer/.streetscape-public-packets/part1/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('observer/.streetscape-public-packets/part2/**') != ''
        with:
          name: streetscape-public-part2-${{ steps.pins.outputs.sha }}
          path: observer/.streetscape-public-packets/part2/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('observer/.streetscape-public-packets/part3/**') != ''
        with:
          name: streetscape-public-part3-${{ steps.pins.outputs.sha }}
          path: observer/.streetscape-public-packets/part3/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('observer/.streetscape-public-packets/part4/**') != ''
        with:
          name: streetscape-public-part4-${{ steps.pins.outputs.sha }}
          path: observer/.streetscape-public-packets/part4/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('observer/.streetscape-public-packets/part5/**') != ''
        with:
          name: streetscape-public-part5-${{ steps.pins.outputs.sha }}
          path: observer/.streetscape-public-packets/part5/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('observer/.streetscape-public-packets/part6/**') != ''
        with:
          name: streetscape-public-part6-${{ steps.pins.outputs.sha }}
          path: observer/.streetscape-public-packets/part6/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('observer/.streetscape-public-packets/part7/**') != ''
        with:
          name: streetscape-public-part7-${{ steps.pins.outputs.sha }}
          path: observer/.streetscape-public-packets/part7/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
