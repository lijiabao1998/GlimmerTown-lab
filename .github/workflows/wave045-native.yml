name: wave045-native
on:
  push:
    branches: ['gpt/british-wave17-045']
    paths-ignore: ['docs/**', '**.md']
permissions:
  contents: read
concurrency:
  group: wave045-native
  cancel-in-progress: true
jobs:
  public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Native Chinese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - name: Read actual public Pages HTML and render the real online city
        run: node probePublicWave045.cjs
      - name: Preserve actual HTTP, browser and screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave045-public-site-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: shots/wave045/public-site/
          retention-days: 14
          if-no-files-found: error
  construction-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Native Chinese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - name: Additional cold versus natural-ready and explicit-flush construction proof
        run: node probeConstruction045.cjs
      - name: Preserve all original and strict readiness outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave045-construction-readiness-${{ github.sha }}
          path: shots/wave045/construction/
          retention-days: 14
          if-no-files-found: error
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Native Chinese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - name: Early native preview with explicit prototype provenance
        run: node previewWave045.cjs
      - name: Preserve raw native preview before longer acceptance work
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave045-preview-${{ github.sha }}
          path: shots/wave045/preview/
          retention-days: 14
          if-no-files-found: error
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Native Chinese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - name: Source-only world geometry and real structural negative controls
        run: node checkOriginalGeometry045.cjs
      - name: Original-ten provenance and unchanged published sources
        run: node checkWave045ReleaseSources.cjs
      - name: Native catalog, paid transactions, save-load and first-RED controls
        run: node probeBritishWaveRelease045.cjs
      - name: Complete ten-model native powered/off/restored matrix and strict phase controls
        run: node probeTenPowerRelease045.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave045-native-${{ github.sha }}
          path: |
            shots/wave045/
            !shots/wave045/night-power/**
          if-no-files-found: error
          retention-days: 14
      - name: Preserve complete ten power core evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave045-ten-power-core-${{ github.sha }}
          path: |
            shots/wave045/night-power/*.json
            shots/wave045/night-power/*.gz
            shots/wave045/night-power/*.html
            shots/wave045/night-power/*.txt
          retention-days: 14
          if-no-files-found: error

      - name: Preserve complete ten power on evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave045-ten-power-on-${{ github.sha }}
          path: |
            shots/wave045/night-power/*-on-*.png
            shots/wave045/night-power/head-negative-missing-new-night.png
          retention-days: 14
          if-no-files-found: warn

      - name: Preserve complete ten power road-cut evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave045-ten-power-road-cut-${{ github.sha }}
          path: |
            shots/wave045/night-power/*-road-cut-*.png
          retention-days: 14
          if-no-files-found: warn

      - name: Preserve complete ten power source-off evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave045-ten-power-source-off-${{ github.sha }}
          path: |
            shots/wave045/night-power/*-source-off-*.png
          retention-days: 14
          if-no-files-found: warn

      - name: Preserve complete ten power restored evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave045-ten-power-restored-${{ github.sha }}
          path: |
            shots/wave045/night-power/*-restored-*.png
          retention-days: 14
          if-no-files-found: warn

  scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Native Chinese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - name: Record independently placed scene coordinates
        run: node previewWave045.cjs
      - name: Exact old-save and whole-frame guard, seasons, edges and layers
        run: node probeScenesRelease045.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave045-scenes-${{ github.sha }}
          path: shots/wave045/scenes/
          if-no-files-found: error
          retention-days: 14
  pedestrians:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Native Chinese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - name: Record independently placed scene coordinates
        run: node previewWave045.cjs
      - name: Real native pedestrian drawing, depth, occlusion and first-RED controls
        run: node probePedestrians045.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave045-pedestrians-${{ github.sha }}
          path: shots/wave045/pedestrians/
          if-no-files-found: error
          retention-days: 14
  normal-pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Native Chinese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - name: Independent BASE-HEAD same-seed complete native states
        run: node probeNativePairsRelease045.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave045-normal-pairs-${{ github.sha }}
          path: shots/wave045/normal-pairs/
          if-no-files-found: error
          retention-days: 14
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Native Chinese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - name: Forty interleaved native BASE-HEAD samples and no warm rebake
        run: node probePerformance045.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave045-performance-${{ github.sha }}
          path: shots/wave045/performance/
          if-no-files-found: error
          retention-days: 14
  baseline-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Native Chinese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - name: Exact native fp calculation against the independent main base
        shell: bash
        run: |
          set -euo pipefail
          git show "$(git merge-base origin/main HEAD):fp.json" > "$RUNNER_TEMP/fp-base.json"
          git show "$(git merge-base origin/main HEAD):style.json" > "$RUNNER_TEMP/style-base.json"
          if node -e "const f=require('./fp.json');process.exit(Object.hasOwn(f.subs,'bld.24_1_800')?1:0)"; then
            node fp.js --check --expect=bld --report-base="$RUNNER_TEMP/fp-base.json" --report-base-style="$RUNNER_TEMP/style-base.json" --dump=fp-rebake
          else
            node fp.js --check --report-base="$RUNNER_TEMP/fp-base.json" --report-base-style="$RUNNER_TEMP/style-base.json" --dump=fp-rebake
          fi
          node proveWave045Baseline.cjs
      - name: Record exact produced baseline hashes and source tree
        if: always()
        run: |
          node - <<'JS'
          const fs=require('node:fs'),crypto=require('node:crypto'),cp=require('node:child_process');
          const files=['fp.json','style.json'].map(name=>{const b=fs.readFileSync('fp-rebake/'+name);return{name,bytes:b.length,sha256:crypto.createHash('sha256').update(b).digest('hex')};});
          const manifest={head:process.env.GITHUB_SHA,tree:cp.execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(),files,source:'Exact fp-rebake bytes produced above; no baseline content edits'};
          fs.writeFileSync('fp-rebake/provenance-wave045.json',JSON.stringify(manifest,null,2)+'\n');console.log('WAVE045_BASE_PROVENANCE '+JSON.stringify(manifest));
          JS
      - name: Byte-preserving evidence transfer
        if: always()
        run: node -e "const fs=require('fs'),c=require('crypto');for(const n of ['fp.json','style.json']){const b=fs.readFileSync('fp-rebake/'+n),s=b.toString('base64');console.log('WAVE045_BASE_BEGIN '+JSON.stringify({name:n,head:process.env.GITHUB_SHA,bytes:b.length,sha256:c.createHash('sha256').update(b).digest('hex')}));for(let i=0;i<s.length;i+=4096)console.log('WAVE045_BASE_DATA '+s.slice(i,i+4096));console.log('WAVE045_BASE_END '+n);}"
      - name: Preserve actual committed index bytes and Git-object binding
        run: |
          node - <<'JS'
          const fs=require('node:fs'),cp=require('node:child_process'),crypto=require('node:crypto'),assert=require('node:assert/strict');
          const source=fs.readFileSync('index.html'),committed=cp.execFileSync('git',['show','HEAD:index.html'],{maxBuffer:32*1024*1024});
          assert(source.equals(committed),'source bytes must equal independent committed Git object');
          const gitBlob=cp.execFileSync('git',['rev-parse','HEAD:index.html'],{encoding:'utf8'}).trim();
          const actualBlob=crypto.createHash('sha1').update(Buffer.concat([Buffer.from('blob '+source.length+'\0'),source])).digest('hex');assert.equal(actualBlob,gitBlob);
          const proof={head:process.env.GITHUB_SHA,tree:cp.execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(),gitBlob,bytes:source.length,sha256:crypto.createHash('sha256').update(source).digest('hex'),committedObjectBytesEqual:true};
          fs.copyFileSync('index.html','fp-rebake/index.html');fs.writeFileSync('fp-rebake/source-index-provenance.json',JSON.stringify(proof,null,2)+'\n');console.log('WAVE045_SOURCE_PROVENANCE '+JSON.stringify(proof));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fp-${{ github.sha }}
          path: fp-rebake/
          if-no-files-found: error
          retention-days: 14
  scene-evidence:
    needs: scenes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        part: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: wave045-scenes-${{ github.sha }}
          path: shots/wave045/scenes/
      - name: Transfer two byte-exact already captured close scenes
        env:
          WAVE045_SCENE_PART: ${{ matrix.part }}
        run: node transferWave045CloseScenes.cjs

  source-evidence:
    needs: baseline-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: fp-${{ github.sha }}
          path: fp-rebake/
      - name: Transfer bounded exact original index bytes, no game execution
        env:
          WAVE045_SOURCE_PART: ${{ matrix.part }}
        run: node transferWave045Source.cjs

  sprite-evidence:
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        part: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: wave045-preview-${{ github.sha }}
          path: shots/wave045/preview/
      - name: Transfer sixteen unchanged already-rendered sprite PNGs
        run: node transferWave045Evidence.cjs sprites ${{ matrix.part }}

  power-evidence:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: wave045-ten-power-core-${{ github.sha }}
          path: shots/wave045/night-power/
      - name: Transfer exact existing complete power manifest
        run: node transferWave045Evidence.cjs power
