name: quayside-legacy017
'on':
  push:
    branches:
    - gpt/british-quayside-details-017
    paths-ignore:
    - '**.md'
    - docs/**
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: quayside-legacy017-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Native font
      run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
    - name: Complete candidate-only source and adapter controls
      run: 'set -euo pipefail

        node quayside-static-contract017.js

        node quayside-compatibility017.js --static-test

        node quayside-legacy017.js --static-test

        node quayside-integration-qa017.js --static-test

        node quayside-gameplay017.test.js

        node quayside-style017.test.js

        for f in *017.js; do node --check "$f"; done

        python3 quayside-workflow017.test.py

        '
    - name: All unchanged016 and earlier source controls in frozen approved worktrees
      run: "set -euo pipefail\nbaseline=\"$(mktemp -d /tmp/quayside-t729-controls-XXXXXX)\"\ngit worktree\
        \ add --detach \"$baseline\" c7f0ab6e6d2c37651fd13802049b8079c5f5d37b\n(\n cd \"$baseline\"\n\
        \ node gardenlife-static-contract016.js\n node gardenlife-release-contract016.test.js\n node gardenlife-compatibility016.js\
        \ --static-test\n node gardenlife-legacy016.js --static-test\n node gardenlife-integration-qa016.js\
        \ --static-test\n node gardenlife-gameplay016.test.js\n node gardenlife-style016.test.js\n python3\
        \ gardenlife-workflow016.test.py\n python3 gardenlife-native-workflow016.test.py\n)\nset -euo\
        \ pipefail\nbaseline=\"$(mktemp -d /tmp/gardenlife-t728-controls-XXXXXX)\"\ngit worktree add --detach\
        \ \"$baseline\" bcd77d5e959ed801d920766cbc9dc010cce19f58\n(\n cd \"$baseline\"\n node streetscape-static-contract015.js\n\
        \ node streetscape-release-contract015.test.js\n node streetscape-compatibility015.js --static-test\n\
        \ node streetscape-legacy015.js --static-test\n node streetscape-integration-qa015.js --static-test\n\
        \ node streetscape-style015.test.js\n python3 streetscape-workflow015.test.py\n)\nset -euo pipefail\n\
        baseline=\"$(mktemp -d /tmp/streetscape-t727-controls-XXXXXX)\"\ngit worktree add --detach \"\
        $baseline\" 6d137b6be31a7f07867b8ebb181fb8ed3727b049\ncd \"$baseline\"\nnode complexes-static-contract014.js\n\
        node complexes-release-contract014.test.js\npython3 integrate-complexes014.test.py\nnode complexes-gameplay014.js\
        \ --static-test\nnode complexes-fixture014.test.js\nnode complexes-integration-qa014.js --static-test\n\
        python3 complexes-workflow014.test.py\nnode complexes-regression-adapter014.js --static-test\n\
        node complexes-regression-adapter014.test.js\nnode complexes-regression-adapter014.js --historical-source-tests\n\
        node complexes-style-adapter014.js --static-test\nnode complexes-style-adapter014.test.js\nnode\
        \ complexes-compatibility014.test.js --static-test\n"
    - name: Strict full3139 current preflight before retained016 legacy preflight
      run: 'set -euo pipefail

        QS017_MODE=preflight node quayside-integration-qa017.js 2>&1 | tee quayside-full-preflight.txt

        node quayside-legacy017.test.js quayside-evidence/preflight/fingerprint-native.json

        node quayside-style017.test.js quayside-evidence/preflight/fingerprint-native.json

        QS017_SUITE=streetscape QS017_MODE=preflight node quayside-legacy017.js 2>&1 | tee quayside-retained-legacy016-preflight.txt

