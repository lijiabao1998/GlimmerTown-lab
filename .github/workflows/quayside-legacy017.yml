    - uses: actions/upload-artifact@v4
      with:
        name: quayside-full-native-fingerprint-${{ github.sha }}
        path: quayside-evidence/preflight/fingerprint-native.json
        if-no-files-found: error
        retention-days: 14
    - name: Every tracked product and historical source remains exact
      if: always()
      run: git diff --exit-code
    - name: Retain every raw report and lossless PNG in bounded packets
      if: always()
      run: python3 quayside-package017.py
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('.quayside-packets/part0/**') != ''
