name: coldload-public011

on:
  workflow_run:
    workflows: [pages]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Exact full 40-character T724 SHA already deployed by the existing Pages workflow
        required: true
        type: string
      url:
        description: Deployment-verified official origin only; other URLs are rejected
        required: true
        default: https://lijiabao1998.github.io/GlimmerTown-lab/
        type: string

# Observer only. No deployment, repository/settings writes, or credentials.
permissions:
  contents: read

concurrency:
  group: coldload-public011-${{ github.event.workflow_run.head_sha || inputs.sha }}
  cancel-in-progress: false

jobs:
  public-origin:
    # A later commit body can mention this historical release. Only a title
    # beginning with the exact T724 prefix may start this automatic observer.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_commit.message, 'T724 '))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
      PUBLIC_SITE_URL: ${{ inputs.url || 'https://lijiabao1998.github.io/GlimmerTown-lab/' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static input, observer and exact release contract checks
        run: |
          set -euo pipefail
          [[ "$EXPECTED_DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_DEPLOY_SHA"
          test "$PUBLIC_SITE_URL" = 'https://lijiabao1998.github.io/GlimmerTown-lab/'
          git fetch --depth=1 origin 759394f8bd48dbe77fb21e8604015e2d1ca56d21
          node --check coldload-public-qa011.js
          node --check coldload-public-state011.js
          node --check coldload-public-log011.js
          node coldload-public-source-qa011.js
          node coldload-static-contract011.js
      - name: Native font environment
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - name: Exact public HTML, native paid museum and repeated real cold reloads
        run: |
          set -euo pipefail
          mkdir -p coldload-evidence/public
          node coldload-public-qa011.js 2>&1 | tee coldload-evidence/public/runtime.txt
      - name: Product, baselines, harness and tracked files remain unchanged
        if: always()
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coldload-public-${{ env.EXPECTED_DEPLOY_SHA }}
          path: coldload-evidence/public/
          if-no-files-found: warn
          retention-days: 14
