    steps:
    - *id001
    - *id002
    - *id003
    - &id004
      uses: actions/download-artifact@v4
      with:
        name: streetscape-full-native-fingerprint-${{ github.sha }}
        path: streetscape-evidence/preflight
    - &id005
      name: Independent exact-head preflight input
      run: node -e "const p=require('./streetscape-fingerprint015').readPreflight015();
        console.log(JSON.stringify(p.proof));"
    - name: Unchanged historical gameplay, camera, construction, weather or cold-load
        mode
      run: 'set -o pipefail

        SC015_SUITE=${{ matrix.suite }} SC015_MODE=${{ matrix.mode }} SC015_GROUP=${{
        matrix.group }} node streetscape-legacy015.js 2>&1 | tee streetscape-legacy-${{
        matrix.suite }}-${{ matrix.mode }}-${{ matrix.group }}.txt

