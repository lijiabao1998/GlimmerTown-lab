  compatibility:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - name: Three smokes, retained exact style guard, complete original eight-world
        comparison
      run: 'set -euo pipefail

        mkdir -p streetscape-evidence/compatibility/logs

        for n in 1 2 3; do node smoke.js 2>&1 | tee streetscape-evidence/compatibility/logs/smoke-$n.txt;
        done

        node streetscape-style015.js 2>&1 | tee streetscape-evidence/compatibility/logs/style.txt

        SC015_SUITE=complexes SC015_MODE=fingerprint node streetscape-legacy015.js
        2>&1 | tee streetscape-evidence/compatibility/logs/strict-native.txt

        SC015_SUITE=compatibility SC015_MODE=gameplay node streetscape-legacy015.js
        2>&1 | tee streetscape-legacy-compatibility.txt

        node streetscape-compatibility015.test.js museum-evidence/compatibility/guards/compatibility.json
        2>&1 | tee streetscape-compatibility-data.txt

        '
    - name: Every tracked product and historical source remains exact
      if: always()
      run: git diff --exit-code
    - name: Retain every raw report and lossless PNG in bounded packets
      if: always()
