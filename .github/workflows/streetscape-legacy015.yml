name: streetscape-legacy015
'on':
  push:
    branches:
    - gpt/british-streetscape-015
    paths-ignore:
    - '**.md'
    - docs/**
    - console-source-observer*.js
    - streetscape-console-diagnostic015.js
    - .github/workflows/streetscape-console015.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: streetscape-legacy015-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
    - &id001
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - &id002
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - &id003
      name: Native font
      run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends
        fonts-wqy-zenhei
    - name: Complete current source and adapter controls
      run: 'set -euo pipefail

        node streetscape-static-contract015.js

        node streetscape-release-contract015.test.js

        node streetscape-compatibility015.js --static-test

        node streetscape-legacy015.js --static-test

        node streetscape-integration-qa015.js --static-test

        node streetscape-style015.test.js

        for f in *015.js; do node --check "$f"; done

        python3 streetscape-workflow015.test.py

        '
    - name: Unchanged historical source controls on exact frozen T727 worktree
      run: 'set -euo pipefail

        baseline="$(mktemp -d /tmp/streetscape-t727-controls-XXXXXX)"

        git worktree add --detach "$baseline" 6d137b6be31a7f07867b8ebb181fb8ed3727b049

        cd "$baseline"

        node complexes-static-contract014.js

        node complexes-release-contract014.test.js

        python3 integrate-complexes014.test.py

        node complexes-gameplay014.js --static-test

        node complexes-fixture014.test.js

        node complexes-integration-qa014.js --static-test

        python3 complexes-workflow014.test.py

        node complexes-regression-adapter014.js --static-test

        node complexes-regression-adapter014.test.js

        node complexes-regression-adapter014.js --historical-source-tests

        node complexes-style-adapter014.js --static-test

        node complexes-style-adapter014.test.js

        node complexes-compatibility014.test.js --static-test

        '
    - name: Current full3091 native preflight and all new projection controls
      run: 'set -euo pipefail

        SC015_MODE=preflight node streetscape-integration-qa015.js 2>&1 | tee streetscape-full-preflight.txt

        node streetscape-legacy015.test.js streetscape-evidence/preflight/fingerprint-native.json

        node streetscape-release-contract015.test.js --native streetscape-evidence/preflight/fingerprint-native.json

        node streetscape-style015.test.js streetscape-evidence/preflight/fingerprint-native.json

        '
    - uses: actions/upload-artifact@v4
      with:
        name: streetscape-full-native-fingerprint-${{ github.sha }}
        path: streetscape-evidence/preflight/fingerprint-native.json
        if-no-files-found: error
        retention-days: 14
    - name: Every tracked product and historical source remains exact
      if: always()
      run: git diff --exit-code
    - name: Retain every raw report and lossless PNG in bounded packets
      if: always()
      run: python3 streetscape-package015.py
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('.streetscape-packets/part0/**') != ''
      with:
        name: streetscape-full-preflight-part0-${{ github.sha }}
        path: .streetscape-packets/part0/
        if-no-files-found: error
        retention-days: 14
        compression-level: 9
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('.streetscape-packets/part1/**') != ''
      with:
        name: streetscape-full-preflight-part1-${{ github.sha }}
        path: .streetscape-packets/part1/
        if-no-files-found: error
        retention-days: 14
        compression-level: 9
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('.streetscape-packets/part2/**') != ''
      with:
        name: streetscape-full-preflight-part2-${{ github.sha }}
        path: .streetscape-packets/part2/
        if-no-files-found: error
        retention-days: 14
        compression-level: 9
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('.streetscape-packets/part3/**') != ''
      with:
        name: streetscape-full-preflight-part3-${{ github.sha }}
        path: .streetscape-packets/part3/
        if-no-files-found: error
        retention-days: 14
        compression-level: 9
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('.streetscape-packets/part4/**') != ''
      with:
        name: streetscape-full-preflight-part4-${{ github.sha }}
        path: .streetscape-packets/part4/
        if-no-files-found: error
        retention-days: 14
        compression-level: 9
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('.streetscape-packets/part5/**') != ''
      with:
        name: streetscape-full-preflight-part5-${{ github.sha }}
        path: .streetscape-packets/part5/
        if-no-files-found: error
        retention-days: 14
        compression-level: 9
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('.streetscape-packets/part6/**') != ''
