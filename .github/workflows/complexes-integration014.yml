name: complexes-integration014
'on':
  push:
    branches:
    - gpt/british-four-complexes-014
    paths-ignore:
    - '**.md'
    - docs/**
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: complexes-integration014-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Native fonts and immutable baseline lineage
      run: 'sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei

        for sha in 10bc4115f119498b4cc5836695348982b85fa9d1 30aa0ebfc7080f268de26541f20da730adca1a8d 248ce802bf4f29333f242447f12b8106af2bdbf1
        6583659d2e14db3b8ae92115d05432d64a0c989d 759394f8bd48dbe77fb21e8604015e2d1ca56d21 d9dfe87689fa841edb8775d0f95db77d9f2deb5b
        559a419270e84d7d67b883581ddef8f24302a41b ed49bab0b73bacfe8c7d6f6a8ca13491b01c9f5f 36632c0e98c3e9daf7a1fa7adfe03a866cb4fbb7;
        do git fetch --depth=1 origin "$sha"; done

        '
    - name: Complete source-only gates followed by native112-art preflight
      run: 'set -o pipefail

        node --check gameplay014.js

        for f in british-*-art014.js complexes-*014.js; do node --check "$f"; done

        node complexes-static-contract014.js

        python3 integrate-complexes014.test.py

        node complexes-gameplay014.js --static-test

        node complexes-fixture014.test.js

        node complexes-integration-qa014.js --static-test

        python3 complexes-workflow014.test.py

        node complexes-regression-adapter014.js --static-test
        node complexes-regression-adapter014.test.js

        node complexes-regression-adapter014.js --historical-source-tests

        node complexes-style-adapter014.js --static-test

        node complexes-style-adapter014.test.js

        CX014_MODE=preflight node complexes-integration-qa014.js 2>&1 | tee complexes-preflight.txt

        node complexes-fingerprint-qa014.js --static-test complexes-evidence/preflight/guards/fingerprint-native.json

        node complexes-historical-bridge014.test.js complexes-evidence/preflight/guards/fingerprint-native.json

        node complexes-style-adapter014.test.js complexes-evidence/preflight/guards/fingerprint-native.json

        '
    - uses: actions/upload-artifact@v4
      with:
        name: complexes-native-fingerprint-${{ github.sha }}
        path: complexes-evidence/preflight/guards/fingerprint-native.json
        if-no-files-found: error
        retention-days: 14
        compression-level: 9
    - name: Every tracked product and historical source byte unchanged
      if: always()
      run: git diff --exit-code
    - name: Package every report and lossless PNG in independently downloadable <=28MiB parts
      if: always()
      run: "python3 - <<'PYCODE'\nimport pathlib, hashlib, json, os, gzip, subprocess\nroot=pathlib.Path('.').resolve();\
        \ out=root/'.complexes-packets'; out.mkdir()\nlimit=28*1024*1024\nsource_hash=hashlib.sha256((root/'index.html').read_bytes()).hexdigest()\n\
        head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()\nassert head==os.environ['GITHUB_SHA']\n\
        files=[]\nfor name in ('complexes-evidence','theatre-evidence','riverside-evidence','museum-evidence','publiclife-evidence','station-evidence','streetlife-evidence','coldload-evidence011'):\n\
        \ p=root/name\n if p.exists(): files.extend(x for x in p.rglob('*') if x.is_file())\nfiles.extend(root.glob('theatre-*.txt'));files.extend(root.glob('complexes-*.txt'))\n\
        if (root/'shots').exists(): files.extend((root/'shots').glob('smoke-*.png'))\nfiles=sorted(set(files))\n\
        assert files, 'No evidence files to package'\npackets=[]\nfor file in files:\n rel=file.relative_to(root).as_posix();\
        \ data=file.read_bytes(); encoded=data; target=rel; compression='none'\n if len(encoded)>limit-65536:\n\
        \  assert file.suffix in ('.json','.txt','.log'), 'Individual lossless screenshot exceeds safe artifact\
        \ bound'\n  encoded=gzip.compress(data,compresslevel=9,mtime=0); target+='.gz'; compression='gzip'\n assert\
        \ len(encoded)<=limit-65536, 'An individual evidence payload exceeds the bound'\n n=next((n for n,q in enumerate(packets)\
        \ if q['payloadBytes']+len(encoded)<=limit-65536),len(packets))\n if n==len(packets):\n  assert n<8, 'Evidence\
        \ exceeds eight bounded artifacts; split the job without dropping evidence'\n  packets.append({'checkedSHA':head,'sourceSHA256':source_hash,'run':os.environ['GITHUB_RUN_ID'],'part':n,'payloadBytes':0,'files':[]})\n\
        \ q=packets[n]; dest=out/('part'+str(n))/target;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(encoded)\n\
        \ q['payloadBytes']+=len(encoded);q['files'].append({'originalPath':rel,'payloadPath':target,'compression':compression,'originalBytes':len(data),'payloadBytes':len(encoded),'sha256':hashlib.sha256(data).hexdigest(),'payloadSHA256':hashlib.sha256(encoded).hexdigest()})\n\
        for n,q in enumerate(packets):\n q['packetCount']=len(packets); q['completeFileCount']=len(files)\n dest=out/('part'+str(n));(dest/'packet-index.json').write_text(json.dumps(q,indent=2)+'\\\
        n')\n size=sum(f.stat().st_size for f in dest.rglob('*') if f.is_file());assert size<=limit\n print(json.dumps({'part':n,'files':len(q['files']),'rawBytes':size,'maximumRawBytes':limit,'checkedSHA':head,'sourceSHA256':source_hash}))\n\
        PYCODE\n"
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('.complexes-packets/part0/**') != ''
      with:
        name: complexes-preflight-part0-${{ github.sha }}
        path: .complexes-packets/part0/
        if-no-files-found: error
        retention-days: 14
        compression-level: 9
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('.complexes-packets/part1/**') != ''
      with:
        name: complexes-preflight-part1-${{ github.sha }}
        path: .complexes-packets/part1/
        if-no-files-found: error
        retention-days: 14
        compression-level: 9
    - uses: actions/upload-artifact@v4
