      with:
        name: complexes-preflight-part2-${{ github.sha }}
        path: .complexes-packets/part2/
        if-no-files-found: error
        retention-days: 14
        compression-level: 9
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('.complexes-packets/part3/**') != ''
      with:
        name: complexes-preflight-part3-${{ github.sha }}
        path: .complexes-packets/part3/
        if-no-files-found: error
        retention-days: 14
        compression-level: 9
    - uses: actions/upload-artifact@v4
