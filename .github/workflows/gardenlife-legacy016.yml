name: gardenlife-legacy016
'on':
  push:
    branches:
    - gpt/british-garden-life-016
    paths-ignore:
    - '**.md'
    - docs/**
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: gardenlife-legacy016-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
    - &id001
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - &id002
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - &id003
      name: Native font
      run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends
        fonts-wqy-zenhei
    - name: Complete current source and adapter controls
      run: |
        set -euo pipefail
        node gardenlife-static-contract016.js
        node gardenlife-compatibility016.js --static-test
        node gardenlife-legacy016.js --static-test
        node gardenlife-integration-qa016.js --static-test

        node gardenlife-gameplay016.test.js
        node gardenlife-style016.test.js
        for f in *016.js; do node --check "$f"; done
        python3 gardenlife-workflow016.test.py
    - name: Unchanged015 and earlier source controls in frozen approved worktrees
      run: |
        set -euo pipefail
        baseline="$(mktemp -d /tmp/gardenlife-t728-controls-XXXXXX)"
        git worktree add --detach "$baseline" bcd77d5e959ed801d920766cbc9dc010cce19f58
        (
         cd "$baseline"
         node streetscape-static-contract015.js
         node streetscape-release-contract015.test.js
         node streetscape-compatibility015.js --static-test
         node streetscape-legacy015.js --static-test
         node streetscape-integration-qa015.js --static-test
         node streetscape-style015.test.js
         python3 streetscape-workflow015.test.py
        )
        set -euo pipefail
        baseline="$(mktemp -d /tmp/streetscape-t727-controls-XXXXXX)"
        git worktree add --detach "$baseline" 6d137b6be31a7f07867b8ebb181fb8ed3727b049
        cd "$baseline"
        node complexes-static-contract014.js
        node complexes-release-contract014.test.js
        python3 integrate-complexes014.test.py
        node complexes-gameplay014.js --static-test
        node complexes-fixture014.test.js
        node complexes-integration-qa014.js --static-test
        python3 complexes-workflow014.test.py
        node complexes-regression-adapter014.js --static-test
        node complexes-regression-adapter014.test.js
        node complexes-regression-adapter014.js --historical-source-tests
        node complexes-style-adapter014.js --static-test
        node complexes-style-adapter014.test.js
        node complexes-compatibility014.test.js --static-test
    - name: Strict full3115 current preflight before original015 legacy preflight
      run: |
        set -euo pipefail
        GL016_MODE=preflight node gardenlife-integration-qa016.js 2>&1 | tee gardenlife-full-preflight.txt
        node gardenlife-legacy016.test.js gardenlife-evidence/preflight/fingerprint-native.json
        node gardenlife-style016.test.js gardenlife-evidence/preflight/fingerprint-native.json
        GL016_SUITE=streetscape GL016_MODE=preflight node gardenlife-legacy016.js 2>&1 | tee gardenlife-retained-legacy015-preflight.txt
    - uses: actions/upload-artifact@v4
      with:
        name: gardenlife-full-native-fingerprint-${{ github.sha }}
        path: gardenlife-evidence/preflight/fingerprint-native.json
        if-no-files-found: error
        retention-days: 14
    - name: Every tracked product and historical source remains exact
      if: always()
      run: git diff --exit-code
    - name: Retain every raw report and lossless PNG in bounded packets
      if: always()
      run: python3 gardenlife-package016.py
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('.gardenlife-packets/part0/**') != ''
      with:
        name: gardenlife-full-preflight-part0-${{ github.sha }}
        path: .gardenlife-packets/part0/
        if-no-files-found: error
        retention-days: 14
        compression-level: 9
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('.gardenlife-packets/part1/**') != ''
      with:
        name: gardenlife-full-preflight-part1-${{ github.sha }}
        path: .gardenlife-packets/part1/
        if-no-files-found: error
        retention-days: 14
        compression-level: 9
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('.gardenlife-packets/part2/**') != ''
      with:
        name: gardenlife-full-preflight-part2-${{ github.sha }}
        path: .gardenlife-packets/part2/
        if-no-files-found: error
        retention-days: 14
        compression-level: 9
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('.gardenlife-packets/part3/**') != ''
      with:
        name: gardenlife-full-preflight-part3-${{ github.sha }}
        path: .gardenlife-packets/part3/
        if-no-files-found: error
        retention-days: 14
        compression-level: 9
    - uses: actions/upload-artifact@v4
