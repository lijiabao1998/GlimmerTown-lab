name: waterfront-public018
on:
  # Parent pushes only after exact T731 Pages publication is confirmed.
  push:
    branches: ['gpt/waterfront-public018']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: waterfront-public018-${{ github.ref }}
  cancel-in-progress: false

jobs:
  official-origin:
    if: github.repository == 'lijiabao1998/GlimmerTown-lab' && github.ref == 'refs/heads/gpt/waterfront-public018'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: observer
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Load exact approved main deployment receipt
        id: pins
        working-directory: observer
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),p=require('./waterfront-public-release018.json');
          require('./waterfront-public-contract018').verifyPins013(p);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'sha='+p.releaseSHA+'\nhtml='+p.sourceSHA256+'\n');
          NODE
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pins.outputs.sha }}
          path: deployed
          persist-credentials: false
      - name: Read successful exact main Pages deployment
        env:
          EXPECTED_DEPLOY_SHA: ${{ steps.pins.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node observer/waterfront-public-pages018.js
      - name: Source-only observer tests and immutable release provenance
        env:
          EXPECTED_DEPLOY_SHA: ${{ steps.pins.outputs.sha }}
          EXPECTED_RELEASE_HTML_SHA256: ${{ steps.pins.outputs.html }}
          EXPECTED_RELEASE_ROOT: ${{ github.workspace }}/deployed
        run: |
          set -euo pipefail
          git -C deployed fetch --depth=1 origin f2123f682b893828e8c306e1f5609603a8e8fd08
          git -C deployed fetch --depth=1 origin 1400301238f7a46ab6d3c489422a48f9f90cac9d
          git -C deployed fetch --depth=1 origin 8ceebc081dff3f44f31279e5ddab4d60f25933c6
          git -C deployed fetch --depth=1 origin c7f0ab6e6d2c37651fd13802049b8079c5f5d37b
          git -C deployed fetch --depth=1 origin 562dcdac6b0f221f803e5288152805e5dfd1f367
          git -C deployed fetch --depth=1 origin bcd77d5e959ed801d920766cbc9dc010cce19f58
          for file in observer/waterfront-public-*018.js; do node --check "$file"; done
          node observer/console-source-observer-qa015.js
          git -C deployed fetch --depth=1 origin "$(node -p "require('./observer/waterfront-public-release018.json').releaseCandidateSHA")"
          node observer/waterfront-public-source-qa018.js
          node observer/waterfront-public-lifecycle018.test.js
          node observer/waterfront-public-history-tests018.js
          python3 observer/waterfront-public-package018.test.py
          node - <<'NODE'
          const c=require('./observer/waterfront-public-contract018');
          console.log(JSON.stringify(c.verifyRelease013(process.env.EXPECTED_RELEASE_ROOT,process.env.EXPECTED_DEPLOY_SHA,process.env.EXPECTED_RELEASE_HTML_SHA256)));
          NODE
      - name: Native font environment
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - name: Official HTML full old world plus two paid heritage buildings twelve cold Continue cycles and repaired boundary
        env:
          EXPECTED_DEPLOY_SHA: ${{ steps.pins.outputs.sha }}
          EXPECTED_RELEASE_HTML_SHA256: ${{ steps.pins.outputs.html }}
          EXPECTED_RELEASE_ROOT: ${{ github.workspace }}/deployed
          CHROME_PATH: /usr/bin/google-chrome
          PUBLIC_SITE_URL: https://lijiabao1998.github.io/GlimmerTown-lab/
        run: |
          set -euo pipefail
          test -x /usr/bin/google-chrome
          mkdir -p observer/waterfront-evidence/public
          node observer/waterfront-public-qa018.js 2>&1 | tee observer/waterfront-evidence/public/runtime.txt
      - name: Both exact checkouts and all tracked source bytes stay unchanged
        if: always()
        run: |
          git -C observer diff --exit-code
          git -C deployed diff --exit-code
      - name: Preserve every report and lossless screenshot in <=28MiB parts
        if: always()
        run: python3 observer/waterfront-public-package018.py
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('observer/.waterfront-public-packets/part0/**') != ''
        with:
          name: waterfront-public-part0-${{ steps.pins.outputs.sha }}
          path: observer/.waterfront-public-packets/part0/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('observer/.waterfront-public-packets/part1/**') != ''
        with:
          name: waterfront-public-part1-${{ steps.pins.outputs.sha }}
          path: observer/.waterfront-public-packets/part1/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('observer/.waterfront-public-packets/part2/**') != ''
        with:
          name: waterfront-public-part2-${{ steps.pins.outputs.sha }}
          path: observer/.waterfront-public-packets/part2/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('observer/.waterfront-public-packets/part3/**') != ''
        with:
          name: waterfront-public-part3-${{ steps.pins.outputs.sha }}
          path: observer/.waterfront-public-packets/part3/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('observer/.waterfront-public-packets/part4/**') != ''
        with:
          name: waterfront-public-part4-${{ steps.pins.outputs.sha }}
          path: observer/.waterfront-public-packets/part4/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('observer/.waterfront-public-packets/part5/**') != ''
        with:
          name: waterfront-public-part5-${{ steps.pins.outputs.sha }}
          path: observer/.waterfront-public-packets/part5/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('observer/.waterfront-public-packets/part6/**') != ''
        with:
          name: waterfront-public-part6-${{ steps.pins.outputs.sha }}
          path: observer/.waterfront-public-packets/part6/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('observer/.waterfront-public-packets/part7/**') != ''
        with:
          name: waterfront-public-part7-${{ steps.pins.outputs.sha }}
          path: observer/.waterfront-public-packets/part7/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
