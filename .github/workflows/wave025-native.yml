name: wave025-native
on:
  push:
    branches: ['gpt/british-wave01-025']
permissions:
  contents: read
concurrency:
  group: wave025-native
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Native Chinese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - name: Exact source and syntax
        run: node embed-wave025.cjs --check
      - name: Actual native geometry, placement, saves and live negative controls
        run: node probeBritishWave025.cjs
      - name: Original native scenes, old-save fields and base-valve full frames
        if: always()
        run: node probeScenes025.cjs
      - name: Native pedestrian layering with explicit test actors
        if: always()
        run: node probePedestrians025.cjs
      - name: Preserve original images and factual results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave025-native-${{ github.sha }}
          path: shots/wave025/
          if-no-files-found: warn
          retention-days: 14
      - name: Fingerprint against latest-main ancestor and preserve exact baseline bytes
        if: always()
        shell: bash
        run: |
          base=$(git merge-base origin/main HEAD)
          git show "$base:fp.json" > "$RUNNER_TEMP/fp-base025.json"
          git show "$base:style.json" > "$RUNNER_TEMP/style-base025.json"
          node fp.js --check --report-base="$RUNNER_TEMP/fp-base025.json" --report-base-style="$RUNNER_TEMP/style-base025.json" --dump=fp-rebake 2>&1 | tee fp-run.txt
          exit ${PIPESTATUS[0]}
      - name: Byte-preserving public evidence transfer
        if: always()
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          for(const name of ['fp.json','style.json']){
            const file='fp-rebake/'+name;if(!fs.existsSync(file))continue;
            const bytes=fs.readFileSync(file),b64=bytes.toString('base64');
            console.log('WAVE025_FILE_BEGIN '+JSON.stringify({name:file,head:process.env.GITHUB_SHA,bytes:bytes.length,sha256:crypto.createHash('sha256').update(bytes).digest('hex')}));
            for(let i=0;i<b64.length;i+=4096)console.log('WAVE025_FILE_DATA '+b64.slice(i,i+4096));
            console.log('WAVE025_FILE_END '+file);
          }
          NODE
      - name: Preserve fingerprint report and exact CI baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fp-${{ github.sha }}
          path: |
            fp-run.txt
            fp-rebake/
          retention-days: 14

  review-export:
    needs: native
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wave025-native-${{ github.sha }}
          path: collected
      - name: Transfer exact public image evidence for per-image review
        env:
          PART: ${{ matrix.part }}
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');
          const files=[];function walk(dir,rel=''){for(const e of fs.readdirSync(dir,{withFileTypes:true})){const r=path.posix.join(rel,e.name),p=path.join(dir,e.name);if(e.isDirectory())walk(p,r);else if(/\.(png|json)$/.test(r))files.push(r);}}walk('collected');files.sort();
          const chosen=files.filter((p,i)=>i%8===+process.env.PART);console.log('WAVE025_REVIEW_INDEX '+JSON.stringify({head:process.env.GITHUB_SHA,part:+process.env.PART,total:files.length,files:chosen}));
          for(const name of chosen){const bytes=fs.readFileSync(path.join('collected',name)),b64=bytes.toString('base64');console.log('WAVE025_FILE_BEGIN '+JSON.stringify({name,head:process.env.GITHUB_SHA,bytes:bytes.length,sha256:crypto.createHash('sha256').update(bytes).digest('hex')}));for(let i=0;i<b64.length;i+=4096)console.log('WAVE025_FILE_DATA '+b64.slice(i,i+4096));console.log('WAVE025_FILE_END '+name);}
          NODE
