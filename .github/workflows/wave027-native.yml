name: wave027-native
on:
  push:
    branches: ['gpt/british-wave02-027']
    paths-ignore: ['docs/**', '**.md']
permissions:
  contents: read
concurrency:
  group: wave027-native
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Native Chinese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - name: Early native preview with explicit prototype provenance
        run: node previewWave027.cjs
      - name: Preserve raw native preview before longer acceptance work
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave027-preview-${{ github.sha }}
          path: shots/wave027/preview/
          retention-days: 14
          if-no-files-found: error
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Native Chinese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - name: Native catalog, paid transactions, save-load and first-RED controls
        run: node probeBritishWave027.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave027-native-${{ github.sha }}
          path: shots/wave027/
          if-no-files-found: error
          retention-days: 14
      - name: Deliver the remaining eight forms without repeating the first two
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave027-remaining-eight-${{ github.sha }}
          path: shots/wave027/remaining-eight/
          if-no-files-found: error
          retention-days: 14
  scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Native Chinese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - name: Record independently placed scene coordinates
        run: node previewWave027.cjs
      - name: Exact old-save and whole-frame guard, seasons, edges and layers
        run: node probeScenes027.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave027-scenes-${{ github.sha }}
          path: shots/wave027/scenes/
          if-no-files-found: error
          retention-days: 14
  pedestrians:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Native Chinese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - name: Record independently placed scene coordinates
        run: node previewWave027.cjs
      - name: Real native pedestrian drawing, depth, occlusion and first-RED controls
        run: node probePedestrians027.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave027-pedestrians-${{ github.sha }}
          path: shots/wave027/pedestrians/
          if-no-files-found: error
          retention-days: 14
  normal-pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Native Chinese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - name: Independent BASE-HEAD same-seed complete native states
        run: node probeNativePairs027.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave027-normal-pairs-${{ github.sha }}
          path: shots/wave027/normal-pairs/
          if-no-files-found: error
          retention-days: 14
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Native Chinese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - name: Forty interleaved native BASE-HEAD samples and no warm rebake
        run: node probePerformance027.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave027-performance-${{ github.sha }}
          path: shots/wave027/performance/
          if-no-files-found: error
          retention-days: 14
  baseline-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Native Chinese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - name: Exact native fp calculation against the independent main base
        shell: bash
        run: |
          set -euo pipefail
          git show "$(git merge-base origin/main HEAD):fp.json" > "$RUNNER_TEMP/fp-base.json"
          git show "$(git merge-base origin/main HEAD):style.json" > "$RUNNER_TEMP/style-base.json"
          node fp.js --check --report-base="$RUNNER_TEMP/fp-base.json" --report-base-style="$RUNNER_TEMP/style-base.json" --dump=fp-rebake
      - name: Byte-preserving evidence transfer
        if: always()
        run: node -e "const fs=require('fs'),c=require('crypto');for(const n of ['fp.json','style.json']){const b=fs.readFileSync('fp-rebake/'+n),s=b.toString('base64');console.log('WAVE027_BASE_BEGIN '+JSON.stringify({name:n,head:process.env.GITHUB_SHA,bytes:b.length,sha256:c.createHash('sha256').update(b).digest('hex')}));for(let i=0;i<s.length;i+=4096)console.log('WAVE027_BASE_DATA '+s.slice(i,i+4096));console.log('WAVE027_BASE_END '+n);}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave027-fp-rebake-${{ github.sha }}
          path: fp-rebake/
          if-no-files-found: error
          retention-days: 14
  scene-evidence:
    needs: scenes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        part: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: wave027-scenes-${{ github.sha }}
          path: shots/wave027/scenes/
      - name: Transfer two byte-exact already captured close scenes
        env:
          WAVE027_SCENE_PART: ${{ matrix.part }}
        run: node transferWave027Scenes.cjs
