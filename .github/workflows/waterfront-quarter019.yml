name: waterfront-quarter019
'on':
  push:
    branches:
    - gpt/waterfront-cultural-quarter-019
    paths-ignore:
    - '**.md'
    - docs/**
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: waterfront-quarter019-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Native font
      timeout-minutes: 7
      run: |
        set -euo pipefail
        for attempt in 1 2; do
          if sudo timeout --kill-after=5s 90s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq &&
             sudo timeout --kill-after=5s 90s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y -qq --no-install-recommends fonts-wqy-zenhei=0.9.45-8; then
            test "$(dpkg-query -W -f='${Version}' fonts-wqy-zenhei)" = '0.9.45-8'
            test -z "$(dpkg --verify fonts-wqy-zenhei)"
            sha256sum /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc
            exit 0
          fi
          if [ "$attempt" -lt 2 ]; then sleep 5; fi
        done
        echo 'Native font setup failed after two bounded attempts' >&2
        exit 1
    - name: All original018 source controls on immutable approved T731, then current019 adapters
      run: |
        set -euo pipefail
        baseline="$(mktemp -d /tmp/quarter-t731-controls-XXXXXX)"
        git worktree add --detach "$baseline" b101348278b71f133b5f4347bc6e63237c9942a1
        (
         cd "$baseline"
        set -euo pipefail
        node waterfront-static-contract018.js
        node waterfront-release-contract018.test.js
        node waterfront-source-qa018.js
        node waterfront-compatibility018.js --static-test
        node waterfront-legacy018.js --static-test
        node waterfront-style018.test.js
        for f in *018.js; do node --check "$f"; done
        python3 waterfront-workflow018.test.py
        node waterfront-integration-qa018.js --static-test
        node waterfront-compatibility018.test.js --static-test
        node waterfront-session-fingerprint018.test.js
        node mapedge-render018.test.js --static-test
        node mapedge-native-qa018.test.js

        )
        node waterfront-quarter-contract019.js
        node waterfront-quarter-logic019.test.js
        node waterfront-quarter-native019.test.js
        node waterfront-quarter-legacy019.js --static-test
        node waterfront-quarter-compatibility019.js --static-test
        node waterfront-quarter-adapters019.test.js
        python3 waterfront-quarter-workflow019.test.py
        python3 waterfront-quarter-mobile-workflow019.test.py
        python3 waterfront-quarter-package019.test.py
        for f in *019.js; do node --check "$f"; done
    - name: Every unchanged T730 and older source control in frozen approved worktrees
      run: |
        set -euo pipefail
        baseline="$(mktemp -d /tmp/waterfront-t730-controls-XXXXXX)"
        git worktree add --detach "$baseline" 1400301238f7a46ab6d3c489422a48f9f90cac9d
        (
         cd "$baseline"
         node quayside-static-contract017.js
         node quayside-release-contract017.test.js
         node quayside-compatibility017.js --static-test
         node quayside-legacy017.js --static-test
         node quayside-integration-qa017.js --static-test
         node quayside-gameplay017.test.js
         node quayside-style017.test.js
         python3 quayside-workflow017.test.py
         python3 quayside-native-workflow017.test.py
        )
        set -euo pipefail
        baseline="$(mktemp -d /tmp/quayside-t729-controls-XXXXXX)"
        git worktree add --detach "$baseline" c7f0ab6e6d2c37651fd13802049b8079c5f5d37b
        (
         cd "$baseline"
         node gardenlife-static-contract016.js
         node gardenlife-release-contract016.test.js
         node gardenlife-compatibility016.js --static-test
         node gardenlife-legacy016.js --static-test
         node gardenlife-integration-qa016.js --static-test
         node gardenlife-gameplay016.test.js
         node gardenlife-style016.test.js
         python3 gardenlife-workflow016.test.py
         python3 gardenlife-native-workflow016.test.py
        )
        set -euo pipefail
        baseline="$(mktemp -d /tmp/gardenlife-t728-controls-XXXXXX)"
        git worktree add --detach "$baseline" bcd77d5e959ed801d920766cbc9dc010cce19f58
        (
         cd "$baseline"
         node streetscape-static-contract015.js
         node streetscape-release-contract015.test.js
         node streetscape-compatibility015.js --static-test
         node streetscape-legacy015.js --static-test
         node streetscape-integration-qa015.js --static-test
         node streetscape-style015.test.js
         python3 streetscape-workflow015.test.py
        )
        set -euo pipefail
        baseline="$(mktemp -d /tmp/streetscape-t727-controls-XXXXXX)"
        git worktree add --detach "$baseline" 6d137b6be31a7f07867b8ebb181fb8ed3727b049
        cd "$baseline"
        node complexes-static-contract014.js
        node complexes-release-contract014.test.js
        python3 integrate-complexes014.test.py
        node complexes-gameplay014.js --static-test
        node complexes-fixture014.test.js
        node complexes-integration-qa014.js --static-test
        python3 complexes-workflow014.test.py
        node complexes-regression-adapter014.js --static-test
        node complexes-regression-adapter014.test.js
        node complexes-regression-adapter014.js --historical-source-tests
        node complexes-style-adapter014.js --static-test
        node complexes-style-adapter014.test.js
        node complexes-compatibility014.test.js --static-test
    - name: Independent current3179 native preflight before every historical projection
      run: |
        set -euo pipefail
        node waterfront-quarter-preflight019.js 2>&1 | tee waterfront-quarter-preflight019.txt
        node waterfront-quarter-retained-controls019.js waterfront-quarter-evidence/preflight/fingerprint-native.json 2>&1 | tee waterfront-quarter-retained-controls019.txt
        WF019_SUITE=streetscape WF019_MODE=preflight node waterfront-quarter-legacy019.js 2>&1 | tee waterfront-quarter-retained-preflight019.txt
    - uses: actions/upload-artifact@v4
      with:
        name: waterfront-quarter019-native-fingerprint-${{ github.sha }}
        path: waterfront-quarter-evidence/preflight/fingerprint-native.json
        if-no-files-found: error
        retention-days: 14
    - name: Every tracked product and historical source remains exact
      if: always()
      run: git diff --exit-code
    - name: Retain every raw report and lossless PNG in bounded packets
      if: always()
      run: python3 waterfront-quarter-package019.py
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('.waterfront-quarter-packets/part0/**') != ''
      with:
