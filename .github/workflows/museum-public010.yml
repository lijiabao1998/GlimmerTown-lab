name: museum-public010

on:
  workflow_run:
    workflows: [pages]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Exact full 40-character T723 SHA already deployed by the existing Pages workflow
        required: true
        type: string
      url:
        description: Deployment-verified official origin only; other URLs are rejected
        required: true
        default: https://lijiabao1998.github.io/GlimmerTown-lab/
        type: string

# Observer only. No deployment, repository/settings writes, or credentials.
permissions:
  contents: read

concurrency:
  group: museum-public010-${{ github.event.workflow_run.head_sha || inputs.sha }}
  cancel-in-progress: false

jobs:
  public-origin:
    # T724 and later releases skip this historical observer instead of failing
    # obsolete T723 assertions. Explicit manual re-verification remains possible.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       contains(github.event.workflow_run.head_commit.message, 'T723'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
      PUBLIC_SITE_URL: ${{ inputs.url || 'https://lijiabao1998.github.io/GlimmerTown-lab/' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static input and exact checkout checks
        run: |
          set -euo pipefail
          [[ "$EXPECTED_DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_DEPLOY_SHA"
          test "$PUBLIC_SITE_URL" = 'https://lijiabao1998.github.io/GlimmerTown-lab/'
          node --check museum-public-qa010.js
          git fetch --depth=1 origin d9dfe87689fa841edb8775d0f95db77d9f2deb5b
          git fetch --depth=1 origin d859e7570305fbd8c7b6ae9976c5d3e6d703c81b
      - name: Native font environment
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - name: Exact official live bytes, Chrome boot, native museum play and storage
        run: |
          set -euo pipefail
          mkdir -p museum-evidence/public
          node museum-public-qa010.js 2>&1 | tee museum-evidence/public/runtime.txt
      - name: Product, baselines, harness and tracked files remain unchanged
        if: always()
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: museum-public-${{ env.EXPECTED_DEPLOY_SHA }}
          path: museum-evidence/public/
          if-no-files-found: warn
          retention-days: 14
