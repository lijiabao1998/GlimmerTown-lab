        path: .waterfront-quarter-packets/part5/
        if-no-files-found: error
        retention-days: 14
        compression-level: 9
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('.waterfront-quarter-packets/part6/**') != ''
      with:
        name: quarter019-waterfront-full-preflight-part6-${{ github.sha }}
        path: .waterfront-quarter-packets/part6/
        if-no-files-found: error
        retention-days: 14
        compression-level: 9
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('.waterfront-quarter-packets/part7/**') != ''
      with:
        name: quarter019-waterfront-full-preflight-part7-${{ github.sha }}
        path: .waterfront-quarter-packets/part7/
        if-no-files-found: error
        retention-days: 14
        compression-level: 9
  quarter:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 55
