name: streetscape-integration015
permissions:
  contents: read
concurrency:
  group: streetscape-integration015-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Native font
      run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends
        fonts-wqy-zenhei
    - name: Complete source-only and mutation checks
      run: 'set -euo pipefail

        node streetscape-static-contract015.js

        node streetscape-release-contract015.test.js

        node streetscape-compatibility015.js --static-test

        node streetscape-legacy015.js --static-test

        node streetscape-integration-qa015.js --static-test

        for f in *015.js; do node --check "$f"; done

        '
    - name: Exact-head native32 preflight
      run: 'set -o pipefail

        SC015_MODE=preflight node streetscape-integration-qa015.js 2>&1 | tee streetscape-preflight.txt

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: streetscape-preflight-${{ github.sha }}
        path: 'streetscape-evidence/preflight/

          streetscape-preflight.txt

          '
        if-no-files-found: error
        retention-days: 14
    - name: Every tracked source retained
      if: always()
      run: git diff --exit-code
  native:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 48
    strategy:
      fail-fast: false
      matrix:
        mode:
        - gameplay
        - camera0
        - camera1
        - camera2
        - camera3
        - construction0
        - construction1
        - construction2
        - construction3
        - weather
        - coldload
        - occlusion
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Native font
      run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends
        fonts-wqy-zenhei
    - name: Native paid placements and full visual scenes
      run: 'set -o pipefail

        SC015_MODE=${{ matrix.mode }} node streetscape-integration-qa015.js 2>&1 |
        tee streetscape-${{ matrix.mode }}.txt

        '
    - name: Retain every raw report and lossless counterfactual PNG in bounded packets
      if: always()
      run: python3 streetscape-package015.py
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('.streetscape-packets/part0/**') != ''
      with:
        name: streetscape-${{ matrix.mode }}-part0-${{ github.sha }}
        path: .streetscape-packets/part0/
        if-no-files-found: error
        retention-days: 14
        compression-level: 9
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('.streetscape-packets/part1/**') != ''
      with:
        name: streetscape-${{ matrix.mode }}-part1-${{ github.sha }}
        path: .streetscape-packets/part1/
        if-no-files-found: error
        retention-days: 14
        compression-level: 9
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('.streetscape-packets/part2/**') != ''
      with:
        name: streetscape-${{ matrix.mode }}-part2-${{ github.sha }}
        path: .streetscape-packets/part2/
        if-no-files-found: error
        retention-days: 14
        compression-level: 9
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('.streetscape-packets/part3/**') != ''
      with:
        name: streetscape-${{ matrix.mode }}-part3-${{ github.sha }}
        path: .streetscape-packets/part3/
        if-no-files-found: error
        retention-days: 14
        compression-level: 9
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('.streetscape-packets/part4/**') != ''
      with:
        name: streetscape-${{ matrix.mode }}-part4-${{ github.sha }}
        path: .streetscape-packets/part4/
        if-no-files-found: error
        retention-days: 14
        compression-level: 9
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('.streetscape-packets/part5/**') != ''
      with:
        name: streetscape-${{ matrix.mode }}-part5-${{ github.sha }}
        path: .streetscape-packets/part5/
        if-no-files-found: error
        retention-days: 14
        compression-level: 9
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('.streetscape-packets/part6/**') != ''
      with:
        name: streetscape-${{ matrix.mode }}-part6-${{ github.sha }}
        path: .streetscape-packets/part6/
        if-no-files-found: error
        retention-days: 14
        compression-level: 9
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('.streetscape-packets/part7/**') != ''
      with:
        name: streetscape-${{ matrix.mode }}-part7-${{ github.sha }}
        path: .streetscape-packets/part7/
        if-no-files-found: error
        retention-days: 14
        compression-level: 9
    - name: Every tracked source retained
      if: always()
      run: git diff --exit-code
'on':
  push:
    branches:
    - gpt/british-streetscape-015
    paths-ignore:
    - '**.md'
    - docs/**
    - console-source-observer*.js
    - streetscape-console-diagnostic015.js
    - .github/workflows/streetscape-console015.yml
  workflow_dispatch: null
