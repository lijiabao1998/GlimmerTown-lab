name: wave038-native
on:
  push:
    branches: ['gpt/british-wave10-038']
    paths-ignore: ['docs/**', '**.md']
permissions:
  contents: read
concurrency:
  group: wave038-native
  cancel-in-progress: true
jobs:
  candidates-ten:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Same native font environment as reviewed nine
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Exact approved nine bytes and full candidate source boundaries
        run: node checkWave038FullCandidates.cjs
      - name: Ten direct native-kit candidates,93 originals and81 reviewed PNG matches
        run: node previewWave038FullCandidates.cjs
      - name: Preserve complete candidate originals and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave038-ten-candidates-${{ github.sha }}
          path: |
            shots/wave038/candidates/
            shots/wave038/source-preparation/
          retention-days: 14
          if-no-files-found: error
  native-preview-ten:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native font environment
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Early ten-model paid native integration preview, full acceptance separate
        run: node previewWave038.cjs
      - name: Preserve actual preview source-bound originals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave038-ten-native-preview-${{ github.sha }}
          path: shots/wave038/preview/
          retention-days: 14
          if-no-files-found: error
