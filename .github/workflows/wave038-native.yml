name: wave038-native
on:
  push:
    branches: ['gpt/british-wave10-038']
    paths-ignore: ['docs/**', '**.md']
permissions:
  contents: read
concurrency:
  group: wave038-native
  cancel-in-progress: true
jobs:
  candidates-nine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native font environment
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Nine direct native-kit candidates, Silver remains absent
        run: node previewWave038Candidates.cjs
      - name: Preserve actual candidate originals and source-bound manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave038-nine-candidates-${{ github.sha }}
          path: shots/wave038/candidates/
          retention-days: 14
          if-no-files-found: error

  silver-new-references:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Read five newly published independent photo targets once
        env:
          WAVE038_REFERENCE_PART: '2'
          WAVE038_REFERENCE_IDS: silver
        run: python3 collectWave038References.py
      - name: Preserve source originals, headers and failed responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave038-silver-new-references-${{ github.sha }}
          path: shots/wave038/references/
          retention-days: 14
          if-no-files-found: error
