name: wave038-native
on:
  push:
    branches: ['gpt/british-wave10-038']
    paths-ignore: ['docs/**', '**.md']
permissions:
  contents: read
concurrency:
  group: wave038-native
  cancel-in-progress: true
jobs:
  candidates-nine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native font environment
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Nine direct native-kit candidates, Silver remains absent
        run: node previewWave038Candidates.cjs
      - name: Preserve actual candidate originals and source-bound manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave038-nine-candidates-${{ github.sha }}
          path: shots/wave038/candidates/
          retention-days: 14
          if-no-files-found: error

  night-power-nine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native font environment
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Real native generation, bridge/source disconnection and visible night windows
        run: node probeNightPower038.cjs
      - name: Preserve actual night power originals, full saves and native dispatch witnesses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave038-night-power-nine-${{ github.sha }}
          path: shots/wave038/night-power/
          retention-days: 14
          if-no-files-found: error

  partial-native-nine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native font environment
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Source-only boundaries and complete guard preparation
        run: node checkWave038Sources.cjs
      - name: Explicit nine-candidate native integration, full ten-model gates remain blocked
        run: node probePartialNative038.cjs
      - name: Preserve actual partial native source, states, images and precise limits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave038-partial-native-nine-${{ github.sha }}
          path: |
            shots/wave038/partial-native/
            shots/wave038/source-preparation/
          retention-days: 14
          if-no-files-found: error
