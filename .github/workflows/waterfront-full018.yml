    timeout-minutes: 48
    strategy:
      fail-fast: false
      matrix:
        mode:
        - catalog
        - gameplay
        - coldload
        - malformed
        - camera0
        - camera1
        - camera2
        - camera3
        - construction0
        - construction1
        - construction2
        - construction3
        - weather
        - occlusion
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Native font
      run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
    - uses: actions/download-artifact@v4
      with:
        name: waterfront-full-native-fingerprint-${{ github.sha }}
        path: waterfront-evidence/preflight
    - name: Native paid garden details and full visual scenes
      run: 'set -o pipefail

        WF018_MODE=${{ matrix.mode }} node waterfront-integration-qa018.js 2>&1 | tee waterfront-${{ matrix.mode }}.txt

        '
    - name: Retain every raw report and lossless counterfactual PNG in bounded packets
      if: always()
      run: python3 waterfront-package018.py
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('.waterfront-packets/part0/**') != ''
      with:
        name: waterfront-${{ matrix.mode }}-part0-${{ github.sha }}
        path: .waterfront-packets/part0/
        if-no-files-found: error
        retention-days: 14
        compression-level: 9
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('.waterfront-packets/part1/**') != ''
      with:
        name: waterfront-${{ matrix.mode }}-part1-${{ github.sha }}
        path: .waterfront-packets/part1/
        if-no-files-found: error
        retention-days: 14
        compression-level: 9
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('.waterfront-packets/part2/**') != ''
      with:
        name: waterfront-${{ matrix.mode }}-part2-${{ github.sha }}
        path: .waterfront-packets/part2/
        if-no-files-found: error
        retention-days: 14
        compression-level: 9
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('.waterfront-packets/part3/**') != ''
      with:
        name: waterfront-${{ matrix.mode }}-part3-${{ github.sha }}
        path: .waterfront-packets/part3/
        if-no-files-found: error
        retention-days: 14
        compression-level: 9
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('.waterfront-packets/part4/**') != ''
      with:
        name: waterfront-${{ matrix.mode }}-part4-${{ github.sha }}
        path: .waterfront-packets/part4/
        if-no-files-found: error
        retention-days: 14
        compression-level: 9
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('.waterfront-packets/part5/**') != ''
      with:
        name: waterfront-${{ matrix.mode }}-part5-${{ github.sha }}
        path: .waterfront-packets/part5/
        if-no-files-found: error
        retention-days: 14
        compression-level: 9
    - uses: actions/upload-artifact@v4
      if: always() && hashFiles('.waterfront-packets/part6/**') != ''
      with:
        name: waterfront-${{ matrix.mode }}-part6-${{ github.sha }}
        path: .waterfront-packets/part6/
        if-no-files-found: error
