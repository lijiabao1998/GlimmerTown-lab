name: GPT-053 AI full-speed measurement
on:
  push:
    branches: ['gpt/lab-ai-speed-20261030']
    paths:
      - '.github/workflows/gpt-053-ai-speed.yml'
      - 'benchmark053*'
      - 'performance-metrics053*'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gpt-053-${{ github.ref }}
  cancel-in-progress: false
jobs:
  baseline:
    if: github.ref == 'refs/heads/gpt/lab-ai-speed-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        ai: ['on', 'off']
        scene: ['small']
        speed: [5]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chinese font using existing repository QA convention
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - name: Metrics helper independent arithmetic and first-red controls
        run: node --test performance-metrics053.test.cjs
      - name: Native live AI and simulation baseline; no product mutation
        env:
          GPT053_RUN: ${{ github.run_id }}
        run: |
          set -o pipefail
          node benchmark053.cjs --scene=${{ matrix.scene }} --speed=${{ matrix.speed }} --ai=${{ matrix.ai }} --seconds=30 2>&1 | tee benchmark053-run.log
      - name: Preserve original evidence, first failure, profile and trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GPT053-${{ github.sha }}-${{ matrix.scene }}-${{ matrix.speed }}-${{ matrix.ai }}
          path: |
            shots/benchmark053/**
            evidence/ai-speed-053/**
            benchmark053-run.log
          if-no-files-found: error
          retention-days: 30
