name: fiscal026 art-baseline compatibility
on:
  push:
    branches: ['gpt/fiscal-load-readonly-026']
    paths-ignore: ['**.md', 'docs/**']
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Chinese font for unchanged native rendering guards
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - name: Future art rebake, contextual guards and actual negative controls
        run: node probeFiscalArtCompat026.cjs
      - name: Preserve compatibility proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fiscal026-compat-${{ github.sha }}
          path: shots/fiscal026-compat/
          if-no-files-found: error
          retention-days: 14
