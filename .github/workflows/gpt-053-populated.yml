name: GPT-053 native populated fixture feasibility
on:
  push:
    branches: ['gpt/lab-ai-speed-20261030']
    paths:
      - 'populated-fixture053.cjs'
      - 'index.html'
      - '.github/workflows/gpt-053-populated.yml'
permissions:
  contents: read
jobs:
  native-population:
    if: github.ref == 'refs/heads/gpt/lab-ai-speed-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - name: Connect native water and electricity and require real population growth
        run: node populated-fixture053.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GPT053-populated-${{ github.sha }}
          path: shots/populated053/**
          if-no-files-found: error

  populated-paired:
    if: github.ref == 'refs/heads/gpt/lab-ai-speed-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        scene: ['small', 'medium', 'large']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - name: Native populated same-runner ABBA; exact starting state gate
        run: node populated-fixture053.cjs --paired --scene=${{ matrix.scene }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GPT053-populated-paired-${{ matrix.scene }}-${{ github.sha }}
          path: shots/populated-paired053/**
          if-no-files-found: error
